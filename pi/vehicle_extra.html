<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehicle Extra</title>
  <link rel="stylesheet" href="inspector.css">
</head>
<body data-action="vehicle_extra">
  <div class="sdpi-item">
    <label class="sdpi-item-label" for="extra">Extra</label>
    <select class="sdpi-item-value" id="extra"></select>
  </div>
  <div class="sdpi-item">
    <label class="sdpi-item-label" for="mode">Mode</label>
    <select class="sdpi-item-value" id="mode">
      <option value="toggle">Toggle</option>
      <option value="on">Turn on</option>
      <option value="off">Turn off</option>
    </select>
  </div>
  <p class="sdpi-item-help">Applies to your current vehicle.</p>
  <div class="sdpi-item">
    <span class="sdpi-item-label" aria-hidden="true"></span>
    <button class="sdpi-item-value" id="save" type="button" disabled>Save</button>
  </div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <script src="inspector.js"></script>
</body>
</html>
