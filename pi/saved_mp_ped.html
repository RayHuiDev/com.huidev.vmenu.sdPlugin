<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spawn Saved MP Ped</title>
  <link rel="stylesheet" href="inspector.css">
</head>
<body data-action="spawn_saved_mp_ped" data-endpoint="/saved-mp-peds" data-list-key="mpPeds" data-id-setting="savedMpPedId" data-name-setting="savedMpPedName">
  <div class="sdpi-item">
    <label class="sdpi-item-label" for="item">Saved MP ped</label>
    <select class="sdpi-item-value" id="item"><option value="">Loading...</option></select>
  </div>
  <div class="sdpi-item">
    <span class="sdpi-item-label" aria-hidden="true"></span>
    <button class="sdpi-item-value" id="refresh" type="button">Refresh list</button>
  </div>
  <div class="sdpi-item">
    <span class="sdpi-item-label" aria-hidden="true"></span>
    <button class="sdpi-item-value" id="save" type="button" disabled>Save</button>
  </div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <script src="inspector.js"></script>
</body>
</html>
